<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>自动压缩设置</title><link rel="stylesheet" href="style.css"></head><body><main><p class="eyebrow">对话与上下文</p><h1>自动压缩设置</h1><p>当前话题的上下文使用量超过这个比例时，自动生成摘要，缩短后续对话携带的历史。</p><label for="percent">上下文使用比例</label><div class="number"><input id="percent" type="number" min="1" max="99" step="0.1" inputmode="decimal" aria-describedby="hint"><span>%</span></div><input id="slider" aria-label="调整压缩比例" type="range" min="1" max="99" step="0.1"><p id="hint">范围 1%–99%，默认 80%。比例越低，越早压缩。</p><section class="budget"><label class="toggle"><input id="fixed-enabled" type="checkbox"> 同时设置固定触发量</label><label for="token-limit">达到多少 Token 时压缩</label><input id="token-limit" type="number" min="1000" max="2000000" step="1" value="50000"><p>例如 30000 或 50000。与比例阈值相比，先达到的条件先触发。</p><label for="summary-target">摘要目标 Token 数</label><input id="summary-target" type="number" min="256" max="100000" step="1" value="3000"><p>例如 3000。目标仅指历史摘要；当前问题、系统指令及工具说明另计。摘要可能省略细节。</p></section><div class="notice">保存后请重启孵化器，使正在运行的对话后端读取新设置。保存本身不会立即压缩，也不会删除聊天记录。</div><p id="status" role="status" aria-live="polite">正在读取设置…</p><footer><button id="default" type="button">恢复默认</button><button id="save" type="button">保存设置</button></footer></main><script src="renderer.js"></script></body></html>
